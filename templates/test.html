<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Assessment - Augmenza</title>
    <link rel="stylesheet" href="{{ url_for('static', registry='style.css') }}">
    <style>
        .test-container { max-width: 800px; margin: 40px auto; padding: 20px; font-family: sans-serif; }
        .question-card { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid #007bff; }
        .options-list { list-style: none; padding: 0; }
        .option-item { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
        .option-item:hover { background: #eef; }
        .submit-btn { background: #28a745; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; display: block; width: 100%; }
    </style>
</head>
<body>

    <div class="test-container">
        <h2>Technical Assessment</h2>
        <p>Please answer all 30 questions. Do not refresh the page.</p>
        <hr>

        <form action="{{ url_for('submit_test') }}" method="POST">
            {% for i in range(questions|length) %}
            <div class="question-card">
                <p><strong>Question {{ i + 1 }}:</strong> {{ questions[i].q }}</p>
                
                <div class="options-list">
                    {% for j in range(questions[i].options|length) %}
                    <label class="option-item" style="display: block;">
                        <input type="radio" name="q{{ i }}" value="{{ j }}" required>
                        {{ questions[i].options[j] }}
                    </label>
                    {% endfor %}
                </div>

                <input type="hidden" name="correct_{{ i }}" value="{{ questions[i].a }}">
            </div>
            {% endfor %}

            <button type="submit" class="submit-btn">Submit Assessment</button>
        </form>
    </div>

</body>
</html>
