<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment - Augmenza Career</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .sticky-header {
            position: sticky; top: 0; z-index: 1020;
            background: white; border-bottom: 2px solid #dee2e6;
        }
        .proctoring-box {
            position: fixed; bottom: 20px; right: 20px;
            width: 220px; height: 165px;
            border: 4px solid #dc3545; border-radius: 12px;
            background: #000; overflow: hidden; z-index: 1050;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .question-card { border-radius: 10px; transition: 0.3s; }
        .question-card:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #timer { font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="proctoring-box">
        <video id="webcam" autoplay muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        <div style="position: absolute; top: 5px; left: 10px; color: white; font-size: 10px; background: rgba(220, 53, 69, 0.8); padding: 2px 5px; border-radius: 3px;">LIVE PROCTORING</div>
    </div>

    <div class="sticky-header p-3 mb-4 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-0 text-primary">Augmenza Career Assessment</h4>
                <small class="text-muted">Candidate: {{ session.name }}</small>
            </div>
            <div class="text-center">
                <span class="text-muted d-block small">Time Remaining</span>
                <span id="timer" class="text-danger">15:00</span>
            </div>
        </div>
    </div>

    <div class="container">
        <form id="assessmentForm" action="/submit_test" method="POST">
            
            {% for question in questions %}
                {% set outer_loop = loop %}
                
                <div class="card question-card mb-4 p-4 shadow-sm">
                    <h5 class="mb-3">{{ outer_loop.index }}. {{ question.q }}</h5>
                    <div class="options-list">
                        {% for option in question.options %}
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" 
                                   name="q{{ outer_loop.index0 }}" 
                                   id="q{{ outer_loop.index0 }}_{{ loop.index0 }}" 
                                   value="{{ loop.index0 }}" required>
                            <label class="form-check-label w-100" for="q{{ outer_loop.index0 }}_{{ loop.index0 }}">
                                {{ option }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}

            <div class="text-center mb-5">
                <button type="submit" class="btn btn-primary btn-lg px-5">Submit Assessment</button>
            </div>
        </form>
    </div>

    <script>
        // --- 1. PROCTORING: Camera Initialization ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) {
                alert("Camera access is required for proctoring. Please enable it and refresh.");
            }
        }
        initCamera();

        // --- 2. SECURITY: Tab Switch Detection ---
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                alert("Unauthorized tab switch detected. The test will be submitted automatically.");
                document.getElementById('assessmentForm').submit();
            }
        });

        // --- 3. TIMER: 15 Minute Countdown ---
        let timeRemaining = 15 * 60; // 15 minutes in seconds
        const timerDisplay = document.getElementById('timer');

        const countdown = setInterval(() => {
            let minutes = Math.floor(timeRemaining / 60);
            let seconds = timeRemaining % 60;

            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerDisplay.innerHTML = `${minutes}:${seconds}`;

            if (timeRemaining <= 0) {
                clearInterval(countdown);
                alert("Time is up! Your assessment is being submitted.");
                document.getElementById('assessmentForm').submit();
            }
            timeRemaining--;
        }, 1000);
    </script>

</body>
</html>
