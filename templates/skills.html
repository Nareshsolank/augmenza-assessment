<!DOCTYPE html>
<html>
<head>
    <title>Select Skills - Augmenza</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .skill-card { height: 100%; border-radius: 10px; }
        .category-title { border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-bottom: 15px; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="card shadow border-0 p-4">
            <h2 class="text-center text-primary mb-4">Career & Skill Selection</h2>
            <form action="/generate_test" method="POST">
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Post Applied For</label>
                        <select name="post" class="form-select" required>
                            {% for post in posts %}<option value="{{ post }}">{{ post }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Years of Experience</label>
                        <input type="number" name="experience" class="form-control" min="0" max="60" step="0.1" placeholder="e.g. 5.5" required>
                    </div>
                </div>

                <hr>
                <h5 class="mb-4">Select the Skill Set (You can choose multiple)</h5>

                <div class="row">
                    {% for category, skills in categories.items() %}
                    <div class="col-md-4 mb-4">
                        <div class="card skill-card p-3 shadow-sm">
                            <h6 class="category-title text-primary">{{ category }}</h6>
                            {% for skill in skills %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="skills" value="{{ skill }}" id="{{ skill }}">
                                <label class="form-check-label" for="{{ skill }}">{{ skill }}</label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Proceed to Assessment Paper</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
